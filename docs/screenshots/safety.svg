<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="260" rx="16" fill="#10101a"/>
  <rect x="40" y="50" width="240" height="150" rx="12" fill="none" stroke="#f87171" stroke-width="2"/>
  <rect x="360" y="50" width="240" height="150" rx="12" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="160" y="40" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">Main PC: game only</text>
  <text x="480" y="40" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">Second PC: overlay here</text>
  <text x="160" y="118" fill="#e7e7ee" font-size="14" text-anchor="middle">Anti-cheat screenshots</text>
  <text x="160" y="138" fill="#e7e7ee" font-size="14" text-anchor="middle">and scans this screen</text>
  <path d="M95 160l130 0" stroke="#f87171" stroke-width="3"/><text x="160" y="182" fill="#f87171" font-size="13" text-anchor="middle">no overlay, ever</text>
  <text x="480" y="108" fill="#e7e7ee" font-size="14" text-anchor="middle">Overlay, scenes, webcam,</text>
  <text x="480" y="128" fill="#e7e7ee" font-size="14" text-anchor="middle">clips, recording, streaming</text>
  <path d="M280 125h80" stroke="#f472b6" stroke-width="3"/><path d="M350 117l10 8-10 8" fill="none" stroke="#f472b6" stroke-width="3"/>
  <text x="320" y="112" fill="#f472b6" font-size="11" text-anchor="middle">game</text>
</svg>
